[package]
name = "n8tray-native"
description = "N8 Tray's native shell: the tray icon, its menu and a Slint window around n8tray-core's host, with no WebView."
version.workspace = true
edition.workspace = true
# Slint 1.19 needs 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish = false

# Slint's generated code allows unsafe code where it needs it, which the
# workspace's `forbid` refuses; this crate denies it instead, so its own code
# has none (D11: the OS calls stay in n8tray-platform).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "n8tray-native"
path = "src/main.rs"

# Both renderers are in the default build so one binary can be measured with
# either (`N8TRAY_RENDERER`); a build with one of them only is the way to see
# what linking the other costs (docs/DECISIONS.md, D33).
[features]
default = ["software", "skia-software"]
software = ["slint/renderer-software"]
skia-software = ["slint/renderer-skia-software"]

[dependencies]
n8tray-core = { path = "../crates/n8tray-core" }
n8tray-platform = { path = "../crates/n8tray-platform" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
png = "0.18.1"
# Pinned to Pulse's version, the owner's all-Slint app (D33).
slint = { version = "=1.19.1", default-features = false, features = ["std", "backend-winit", "accessibility", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi", "registry"] }
# The version Tauri's tray uses (and its muda): one GTK in the workspace on
# Linux, where 0.27 needs a newer one than Tauri's.
# Without libxdo, which only Linux's predefined Copy and Paste items use.
tray-icon = { version = "0.25.1", default-features = false, features = ["libappindicator"] }

[dev-dependencies]
serde_json = "1.0.154"

[build-dependencies]
slint-build = "=1.19.1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
