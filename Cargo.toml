[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/n8watkins/n8tray"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The tray stays resident all day: a smaller, stripped binary maps less into memory.
[profile.release]
codegen-units = 1
lto = true
strip = true
