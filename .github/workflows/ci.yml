# CI with release-kit lanes (docs/CI_LANES.md in release-kit): a docs-only pull
# request runs nothing but the commit check, a kit-only update runs
# release-kit verify, and everything else runs the checks on all three OSes.
# Branch protection requires only "CI result".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch: # the release train and manual runs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: What changed
    uses: n8watkins/release-kit/.github/workflows/changes.yml@v2.8.1

  kit:
    name: Kit update
    needs: changes
    if: needs.changes.outputs.kit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install release-kit verify

  # Format, lint (clippy with warnings as errors) and the text check, once.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux packages for the tray and the WebView
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Build the window (the app embeds it)
        run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - run: rustup toolchain install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm run lint

  # Clippy on Windows too: the Job Object, process and GPU code compiles
  # only there.
  lint-windows:
    name: Lint (Windows)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Build the window (the app embeds it)
        run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - run: rustup toolchain install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Unit, schema and integration tests on every OS the tray ships on.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages for the tray and the WebView
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Build the window (the app embeds it)
        run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - run: rustup toolchain install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      - name: The TypeScript bindings match the Rust types
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          changed="$(git status --porcelain -- app/ui/src/bindings)"
          if [ -n "$changed" ]; then
            echo "::error::app/ui/src/bindings is out of date; run cargo test and commit the result."
            echo "$changed"
            exit 1
          fi

  # The window's view models and keyboard (Vitest), then every view against
  # recorded snapshots in Chromium: pictures for review, the keyboard path
  # and an accessibility scan (Playwright). The pictures are an artifact.
  ui:
    name: Window
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
        working-directory: app/ui
      - run: npm run typecheck
        working-directory: app/ui
      - run: npm test
        working-directory: app/ui
      - run: npx playwright install --with-deps chromium
        working-directory: app/ui
      - run: npm run screens
        working-directory: app/ui
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-screens
          path: app/ui/screens/
          if-no-files-found: ignore

  # The real app, built for release, on each OS: its own memory and CPU
  # against the budgets (plan 3.6), enforced on Windows and reported
  # elsewhere, and the real window through WebDriver on Windows and Linux
  # (tauri-driver has no macOS support).
  app:
    name: App (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages for the tray, the WebView and its WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # WebKitWebDriver: webkitgtk-webdriver from Ubuntu 26.04, webkit2gtk-driver before.
          driver=webkitgtk-webdriver; apt-cache show "$driver" > /dev/null 2>&1 || driver=webkit2gtk-driver
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev "$driver" xvfb
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Build the window (the app embeds it)
        run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - run: rustup toolchain install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - run: cargo build --release --locked -p n8tray -p n8tray-conformance --bin n8tray --bin n8tray-fake-module
      - name: Budget (enforced on Windows)
        shell: bash
        run: |
          app=target/release/n8tray; [ "$RUNNER_OS" = Windows ] && app=target/release/n8tray.exe
          run=""; [ "$RUNNER_OS" = Linux ] && run="xvfb-run -a"
          enforce=""; [ "$RUNNER_OS" = Windows ] && enforce="--enforce"
          $run node scripts/tray-budget.mjs --app "$app" $enforce --out "budget-${RUNNER_OS}.json"
      - name: WebDriver tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install tauri-driver --locked --version 2.1.0
          # msedgedriver must match the WebView2 runtime exactly.
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          "NATIVE_DRIVER=$PWD\edgedriver\msedgedriver.exe" | Out-File -Append $env:GITHUB_ENV
      - name: WebDriver tools (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: The real window through WebDriver
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node app/ui/tests/e2e/webdriver.mjs --app target/release/n8tray.exe --fake target/release/n8tray-fake-module.exe --native-driver "$NATIVE_DRIVER" --out screens
          else
            xvfb-run -a node app/ui/tests/e2e/webdriver.mjs --app target/release/n8tray --fake target/release/n8tray-fake-module --out screens
          fi
      - name: The real window, pictured and measured (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-hub-shots.ps1 -Tray target\release\n8tray.exe -Fake target\release\n8tray-fake-module.exe -Out hub-shots
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: |
            budget-*.json
            screens/
            hub-shots/
          if-no-files-found: ignore

  # The release path with a throwaway key: two NSIS installers built and signed
  # the way the App release workflow does it (this version and the next patch),
  # then an update end to end, as a user gets it. The older one is installed,
  # finds the newer in a feed served from the runner, and Install in its
  # window downloads it, verifies it, installs it and starts it again. The
  # test builds trust the throwaway key and allow the plain-HTTP local feed
  # (--config); the real key never reaches a pull request.
  update:
    name: Update (Windows)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui
      - run: rustup toolchain install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer
      - name: A throwaway updater key, trusted by the test builds only
        shell: bash
        run: |
          app/ui/node_modules/.bin/tauri signer generate --ci -w "$RUNNER_TEMP/throwaway.key"
          node -e '
            const fs = require("fs");
            const pubkey = fs.readFileSync(process.argv[1], "utf8").trim();
            fs.writeFileSync(process.argv[2], JSON.stringify({ plugins: { updater: { pubkey, dangerousInsecureTransportProtocol: true } } }));
          ' "$RUNNER_TEMP/throwaway.key.pub" "$RUNNER_TEMP/test-config.json"
      - name: This version's installer
        working-directory: app/src-tauri
        shell: bash
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          ../ui/node_modules/.bin/tauri build --ci --bundles nsis --config "$RUNNER_TEMP/test-config.json"
          mkdir -p "$RUNNER_TEMP/old" && cp ../../target/release/bundle/nsis/*-setup.exe* "$RUNNER_TEMP/old/" && ls -la "$RUNNER_TEMP/old"
      - name: The next patch's installer
        working-directory: app/src-tauri
        shell: bash
        run: |
          next="$(node -e '
            const fs = require("fs");
            const text = fs.readFileSync("../../Cargo.toml", "utf8");
            const [, v] = text.match(/^version = "(\d+\.\d+\.\d+)"$/m);
            const [a, b, c] = v.split(".").map(Number);
            const next = `${a}.${b}.${c + 1}`;
            fs.writeFileSync("../../Cargo.toml", text.replace(`version = "${v}"`, `version = "${next}"`));
            console.log(next);
          ')"
          echo "NEXT=$next" >> "$GITHUB_ENV"
          rm -rf ../../target/release/bundle/nsis
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          ../ui/node_modules/.bin/tauri build --ci --bundles nsis --config "$RUNNER_TEMP/test-config.json"
          mkdir -p "$RUNNER_TEMP/new" && cp ../../target/release/bundle/nsis/*-setup.exe* "$RUNNER_TEMP/new/" && ls -la "$RUNNER_TEMP/new"
      - name: WebDriver tools
        shell: pwsh
        run: |
          cargo install tauri-driver --locked --version 2.1.0
          # msedgedriver must match the WebView2 runtime exactly.
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          "NATIVE_DRIVER=$PWD\edgedriver\msedgedriver.exe" | Out-File -Append $env:GITHUB_ENV
      - name: An update, end to end
        shell: bash
        run: |
          old="$(ls "$RUNNER_TEMP"/old/*-setup.exe)"; new="$(ls "$RUNNER_TEMP"/new/*-setup.exe)"
          node app/ui/tests/e2e/update.mjs --old "$old" --new "$new" --new-version "$NEXT" --native-driver "$NATIVE_DRIVER" --out update-shots
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-windows
          path: update-shots/
          if-no-files-found: ignore

  # The only required check: passes when every job above passed or was
  # skipped on purpose by its lane.
  result:
    name: CI result
    if: always()
    needs: [changes, kit, lint, lint-windows, test, ui, app, update]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped by its lane
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A job ended with '$result'."; exit 1 ;;
            esac
          done
