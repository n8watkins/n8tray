# The app's installer and its update feed, added to a GitHub Release once the
# Release workflow (release-kit) has published it: the NSIS installer, signed
# with N8 Tray's updater key, its signature, checksums, and latest.json, the
# feed every installed N8 Tray reads through
# https://github.com/n8watkins/n8tray/releases/latest/download/latest.json.
#
# Two jobs, so that no job holds both the signing key and write access: the
# build job signs and has read access only; the publish job uploads and never
# sees the key.
#
# Retry with "Run workflow" and the tag. A release that already has these
# files is left alone: delete them first to publish a new build.
name: App release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "The vX.Y.Z tag of a published release"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: app-release-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: A published release
    if: github.repository == 'n8watkins/n8tray' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The tag reaches the shell only through $TAG, and only once it is known
      # to be a plain vX.Y.Z.
      - name: The tag names a published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'; then
            echo "::notice::'$TAG' is not a release tag; run this workflow by hand with the tag to build the app."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "::notice::$TAG has no GitHub Release (a baseline tag); nothing to build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign (Windows)
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui
      - run: rustup toolchain install # the version in rust-toolchain.toml
      # No build cache: a release is built from scratch.
      - name: Build the installer and sign it for the updater
        working-directory: app/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing."
            exit 1
          fi
          ../ui/node_modules/.bin/tauri build --ci --bundles nsis
      - name: Collect the installer and its signature
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir app-release
          setup="target/release/bundle/nsis/N8 Tray_${VERSION}_x64-setup.exe"
          if [ ! -f "$setup" ] || [ ! -f "$setup.sig" ]; then
            echo "::error::No signed installer for $VERSION:"; ls -la target/release/bundle/nsis || true
            exit 1
          fi
          cp "$setup" "app-release/N8Tray_${VERSION}_x64-setup.exe"
          cp "$setup.sig" "app-release/N8Tray_${VERSION}_x64-setup.exe.sig"
          ls -la app-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release
          path: app-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Add to the GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-release
          path: app-release
      - name: The update feed and the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          setup="N8Tray_${VERSION}_x64-setup.exe"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          node scripts/updater-feed.mjs --version "$VERSION" --notes-file notes.md --out app-release/latest.json \
            --platform windows-x86_64 \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup" \
            --sig "app-release/$setup.sig"
          (cd app-release && sha256sum -- "$setup" > "N8Tray_${VERSION}_SHA256SUMS.txt" && cat "N8Tray_${VERSION}_SHA256SUMS.txt")
      - name: Upload, never replacing what people may have downloaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for file in app-release/*; do
            if printf '%s\n' "$existing" | grep -Fxq "$(basename "$file")"; then
              echo "::error::$TAG already has $(basename "$file"); delete the app's files from the release to publish this build."
              exit 1
            fi
          done
          gh release upload "$TAG" app-release/* --repo "$GITHUB_REPOSITORY"
          # The feed must name a file that is really there, with its signature.
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json" -o check.json
          url="$(jq -r '.platforms["windows-x86_64"].url' check.json)"
          curl -fsSIL "$url" > /dev/null
          echo "Published $url"
