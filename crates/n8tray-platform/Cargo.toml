[package]
name = "n8tray-platform"
description = "N8 Tray's OS layer: process snapshots, Job Objects, system memory, GPU counters, autostart and the legacy tray check."
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true

# The OS calls need unsafe code, so this crate cannot take the workspace's
# `forbid`; it denies unsafe code everywhere except the modules that wrap a
# system API (see docs/DECISIONS.md, D11).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
  "Wdk_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.27.0"
