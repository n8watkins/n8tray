[package]
name = "n8tray-core"
description = "N8 Tray's host logic without a window: discovery, intent, supervision, status, lease, settings, measurement and pressure."
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
n8tray-contract = { path = "../n8tray-contract" }
n8tray-platform = { path = "../n8tray-platform" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
globset = { version = "0.4.18", default-features = false }
notify = "8.2.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
ts-rs = "12.0.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
