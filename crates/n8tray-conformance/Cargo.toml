[package]
name = "n8tray-conformance"
description = "The N8 Tray conformance kit: the n8tray-contract CLI (check, probe and the test tray) and a fake module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "n8tray-contract"
path = "src/bin/n8tray-contract.rs"

[[bin]]
name = "n8tray-fake-module"
path = "src/bin/n8tray-fake-module.rs"

[dependencies]
n8tray-contract = { path = "../n8tray-contract" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
